<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Опрос: Кружки и секции</title>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f0f2f5; 
            padding: 20px 10px; 
            margin: 0; 
            display: flex;
            justify-content: center;
        }
        .form-container {
            background: #ffffff;
            padding: 25px 30px;
            max-width: 550px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        h2 { 
            text-align: center; 
            color: #333; 
            margin-top: 0;
            font-size: 24px;
        }
        label { 
            font-weight: 600; 
            margin-top: 15px; 
            display: block; 
            color: #444;
            font-size: 14px;
        }
        input, select { 
            width: 100%; 
            padding: 12px 15px; 
            margin: 8px 0 10px 0; 
            border: 1px solid #dcdcdc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            background-color: #fafafa;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #008CBA;
            background-color: #fff;
        }
        .activity-block { 
            border: 1px solid #e1e4e8; 
            padding: 20px; 
            margin-bottom: 15px; 
            border-radius: 10px; 
            background: #f8f9fa; 
        }
        
        /* Стили для двойного поля времени */
        .time-container {
            display: flex;
            gap: 15px;
        }
        .time-field {
            flex: 1;
        }
        .time-field label {
            margin-top: 5px;
            font-weight: normal;
            font-size: 13px;
            color: #666;
        }

        button { 
            width: 100%; 
            padding: 15px; 
            font-size: 16px; 
            font-weight: bold; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background-color 0.2s;
        }
        .add-btn { background: #008CBA; margin-bottom: 25px; }
        .add-btn:hover { background: #007399; }
        
        .submit-btn { background: #4CAF50; font-size: 18px; }
        .submit-btn:hover { background: #45a049; }
        
        .remove-btn { 
            background: #ff4d4d; 
            padding: 8px 15px; 
            width: auto;
            font-size: 13px; 
            margin-bottom: 15px;
            float: right;
            border-radius: 6px;
        }
        .remove-btn:hover { background: #e60000; }
        
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        @media (max-width: 480px) {
            .form-container { padding: 20px 15px; }
            h2 { font-size: 20px; }
            input, select, button { font-size: 16px; }
            .time-container { gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Сбор данных по кружкам</h2>
        <form id="surveyForm">
            <label>Имя и фамилия ребенка:</label>
            <input type="text" id="childName" required placeholder="Например: Иванов Петя">

            <div id="activitiesContainer">
                <div class="activity-block clearfix">
                    <label>Название кружка/секции:</label>
                    <input type="text" class="act-name" required placeholder="Например: Робототехника">

                    <label>День недели:</label>
                    <select class="act-day">
                        <option value="Понедельник">Понедельник</option>
                        <option value="Вторник">Вторник</option>
                        <option value="Среда">Среда</option>
                        <option value="Четверг">Четверг</option>
                        <option value="Пятница">Пятница</option>
                        <option value="Суббота">Суббота</option>
                        <option value="Воскресенье">Воскресенье</option>
                    </select>

                    <label>Время проведения:</label>
                    <div class="time-container">
                        <div class="time-field">
                            <label>Начало:</label>
                            <input type="time" class="act-time-start" required>
                        </div>
                        <div class="time-field">
                            <label>Окончание:</label>
                            <input type="time" class="act-time-end" required>
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" class="add-btn" onclick="addActivity()">+ Добавить еще кружок</button>
            <button type="submit" class="submit-btn">Отправить данные</button>
        </form>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby7DhiolXlYSY1gGMaOxJ2NjTDD0FAwAu4z3VrUgsIxgdov7MCpMugOIAyxgFg2csbG1A/exec';

        function addActivity() {
            const container = document.getElementById('activitiesContainer');
            const block = document.createElement('div');
            block.className = 'activity-block clearfix';
            block.innerHTML = `
                <button type="button" class="remove-btn" onclick="this.parentElement.remove()">✕ Удалить</button>
                <label>Название кружка/секции:</label>
                <input type="text" class="act-name" required placeholder="Например: Бассейн">
                
                <label>День недели:</label>
                <select class="act-day">
                    <option value="Понедельник">Понедельник</option>
                    <option value="Вторник">Вторник</option>
                    <option value="Среда">Среда</option>
                    <option value="Четверг">Четверг</option>
                    <option value="Пятница">Пятница</option>
                    <option value="Суббота">Суббота</option>
                    <option value="Воскресенье">Воскресенье</option>
                </select>

                <label>Время проведения:</label>
                <div class="time-container">
                    <div class="time-field">
                        <label>Начало:</label>
                        <input type="time" class="act-time-start" required>
                    </div>
                    <div class="time-field">
                        <label>Окончание:</label>
                        <input type="time" class="act-time-end" required>
                    </div>
                </div>
            `;
            container.appendChild(block);
        }

        document.getElementById('surveyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = e.target.querySelector('.submit-btn');
            btn.innerText = 'Отправка...';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            const childName = document.getElementById('childName').value;
            const blocks = document.querySelectorAll('.activity-block');
            const activities = [];

            blocks.forEach(block => {
                // Склеиваем время начала и конца в одну строку
                const timeStart = block.querySelector('.act-time-start').value;
                const timeEnd = block.querySelector('.act-time-end').value;
                const fullTime = timeStart + ' - ' + timeEnd;

                activities.push({
                    name: block.querySelector('.act-name').value,
                    day: block.querySelector('.act-day').value,
                    time: fullTime
                });
            });

            const data = { childName: childName, activities: activities };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if(result.result === 'success') {
                    alert('Данные успешно отправлены! Спасибо.');
                    document.getElementById('surveyForm').reset();
                    
                    const firstBlock = document.querySelector('.activity-block');
                    document.getElementById('activitiesContainer').innerHTML = '';
                    document.getElementById('activitiesContainer').appendChild(firstBlock);
                    const removeBtn = firstBlock.querySelector('.remove-btn');
                    if (removeBtn) removeBtn.remove();
                } else {
                    alert('Произошла ошибка при отправке.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Произошла ошибка.');
            })
            .finally(() => {
                btn.innerText = 'Отправить данные';
                btn.disabled = false;
                btn.style.opacity = '1';
            });
        });
    </script>
</body>
</html>
