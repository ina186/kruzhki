<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Опрос: Кружки и секции</title>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f0f2f5; 
            padding: 20px 10px; 
            margin: 0; 
            display: flex;
            justify-content: center;
        }
        .form-container {
            background: #ffffff;
            padding: 25px 30px;
            max-width: 550px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        h2 { 
            text-align: center; 
            color: #333; 
            margin-top: 0;
            font-size: 24px;
        }
        label { 
            font-weight: 600; 
            margin-top: 15px; 
            display: block; 
            color: #444;
            font-size: 14px;
        }
        input[type="text"], input[type="time"], select { 
            width: 100%; 
            padding: 12px 15px; 
            margin: 8px 0 10px 0; 
            border: 1px solid #dcdcdc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            background-color: #fafafa;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="time"]:focus, select:focus {
            outline: none;
            border-color: #008CBA;
            background-color: #fff;
        }
        .activity-block { 
            border: 1px solid #e1e4e8; 
            padding: 20px; 
            margin-bottom: 15px; 
            border-radius: 10px; 
            background: #f8f9fa; 
        }
        
        /* Стили для дней недели в виде кнопок */
        .days-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0 10px 0;
        }
        .day-btn {
            flex: 1;
            min-width: 40px;
            text-align: center;
            background: #fff;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            padding: 10px 0;
            font-size: 14px;
            color: #555;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }
        .day-btn input {
            display: none;
        }
        .day-btn.selected {
            background: #008CBA;
            color: white;
            border-color: #008CBA;
            font-weight: bold;
        }

        /* Время */
        .time-wrapper {
            display: flex;
            gap: 15px;
            margin-top: 8px;
        }
        .time-box {
            flex: 1;
        }
        .time-box label {
            margin-top: 0;
            font-weight: normal;
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }

        button.action-btn { 
            width: 100%; 
            padding: 15px; 
            font-size: 16px; 
            font-weight: bold; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background-color 0.2s;
        }
        .add-btn { background: #008CBA; margin-bottom: 25px; }
        .add-btn:hover { background: #007399; }
        
        .submit-btn { background: #4CAF50; font-size: 16px; }
        .submit-btn:hover { background: #45a049; }
        
        .remove-btn { 
            background: #ff4d4d; 
            padding: 8px 15px; 
            width: auto;
            font-size: 13px; 
            margin-bottom: 15px;
            float: right;
            border-radius: 6px;
            color: white;
            border: none;
            cursor: pointer;
        }
        .remove-btn:hover { background: #e60000; }
        
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        @media (max-width: 480px) {
            .form-container { padding: 20px 15px; }
            h2 { font-size: 20px; }
            .time-wrapper { gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Сбор данных по кружкам</h2>
        <form id="surveyForm">
            <label>Фамилия и имя ребенка (класс 3В):</label>
            <select id="childName" required>
                <option value="" disabled selected>Выберите ученика из списка...</option>
                <option value="Акберов Бахтияр">Акберов Бахтияр</option>
                <option value="Багаутдинов Амир">Багаутдинов Амир</option>
                <option value="Булкина Варвара">Булкина Варвара</option>
                <option value="Валиев Камиль">Валиев Камиль</option>
                <option value="Галиева Эмилия">Галиева Эмилия</option>
                <option value="Залялов Данияр">Залялов Данияр</option>
                <option value="Захаров Раян">Захаров Раян</option>
                <option value="Зиганшина Алина">Зиганшина Алина</option>
                <option value="Ибрагимов Тимур">Ибрагимов Тимур</option>
                <option value="Кузманович Весна">Кузманович Весна</option>
                <option value="Матвеев Артём">Матвеев Артём</option>
                <option value="Матвеева Вероника">Матвеева Вероника</option>
                <option value="Махмутов Даян">Махмутов Даян</option>
                <option value="Мухтарова Аиша">Мухтарова Аиша</option>
                <option value="Николаев Глеб">Николаев Глеб</option>
                <option value="Ногманова Диана">Ногманова Диана</option>
                <option value="Пронина Виктория">Пронина Виктория</option>
                <option value="Прохоров Мирослав">Прохоров Мирослав</option>
                <option value="Рахматуллина Азалия">Рахматуллина Азалия</option>
                <option value="Рыбакова Раяна">Рыбакова Раяна</option>
                <option value="Рыженко Екатерина">Рыженко Екатерина</option>
                <option value="Садриева Аделия">Садриева Аделия</option>
                <option value="Саетгареева Елизавета">Саетгареева Елизавета</option>
                <option value="Сафаргалиева Эсмира">Сафаргалиева Эсмира</option>
                <option value="Синицин Диас">Синицин Диас</option>
                <option value="Тавбаева Айдарина">Тавбаева Айдарина</option>
                <option value="Тазиева Аделя">Тазиева Аделя</option>
                <option value="Тяминов Радмир">Тяминов Радмир</option>
                <option value="Хайруллина Малика">Хайруллина Малика</option>
                <option value="Хакимов Дамир">Хакимов Дамир</option>
                <option value="Чеканова Анна">Чеканова Анна</option>
                <option value="Шалетин Егор">Шалетин Егор</option>
                <option value="Шарипов Эмир">Шарипов Эмир</option>
                <option value="Шёнфельд Арсений">Шёнфельд Арсений</option>
            </select>

            <div id="activitiesContainer">
                <!-- Контейнер для кружков -->
            </div>

            <button type="button" class="action-btn add-btn" onclick="addActivity()">+ Добавить еще кружок</button>
            <button type="submit" class="action-btn submit-btn">Отправить данные</button>
        </form>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby7DhiolXlYSY1gGMaOxJ2NjTDD0FAwAu4z3VrUgsIxgdov7MCpMugOIAyxgFg2csbG1A/exec';

        // Функция для обработки кликов по дням недели
        function toggleDay(labelElement) {
            const checkbox = labelElement.querySelector('input');
            if (checkbox.checked) {
                labelElement.classList.add('selected');
            } else {
                labelElement.classList.remove('selected');
            }
        }

        function getActivityHTML(isFirst) {
            return `
                ${isFirst ? '' : '<button type="button" class="remove-btn" onclick="this.parentElement.remove()">✕ Удалить</button>'}
                <label>Название кружка/секции:</label>
                <input type="text" class="act-name" required placeholder="Например: Робототехника">
                
                <label>Дни недели:</label>
                <div class="days-wrapper">
                    <label class="day-btn"><input type="checkbox" class="day-cb" value="Пн" onchange="toggleDay(this.parentElement)">Пн</label>
                    <label class="day-btn"><input type="checkbox" class="day-cb" value="Вт" onchange="toggleDay(this.parentElement)">Вт</label>
                    <label class="day-btn"><input type="checkbox" class="day-cb" value="Ср" onchange="toggleDay(this.parentElement)">Ср</label>
                    <label class="day-btn"><input type="checkbox" class="day-cb" value="Чт" onchange="toggleDay(this.parentElement)">Чт</label>
                    <label class="day-btn"><input type="checkbox" class="day-cb" value="Пт" onchange="toggleDay(this.parentElement)">Пт</label>
                    <label class="day-btn"><input type="checkbox" class="day-cb" value="Сб" onchange="toggleDay(this.parentElement)">Сб</label>
                    <label class="day-btn"><input type="checkbox" class="day-cb" value="Вс" onchange="toggleDay(this.parentElement)">Вс</label>
                </div>

                <label>Время проведения:</label>
                <div class="time-wrapper">
                    <div class="time-box">
                        <label>С:</label>
                        <input type="time" class="act-time-start" required>
                    </div>
                    <div class="time-box">
                        <label>ДО:</label>
                        <input type="time" class="act-time-end" required>
                    </div>
                </div>
            `;
        }

        document.getElementById('activitiesContainer').innerHTML = `
            <div class="activity-block clearfix">
                ${getActivityHTML(true)}
            </div>
        `;

        function addActivity() {
            const container = document.getElementById('activitiesContainer');
            const block = document.createElement('div');
            block.className = 'activity-block clearfix';
            block.innerHTML = getActivityHTML(false);
            container.appendChild(block);
        }

        document.getElementById('surveyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const blocks = document.querySelectorAll('.activity-block');
            let hasTimeError = false;
            let hasDayError = false;
            const activities = [];

            blocks.forEach(block => {
                const timeStart = block.querySelector('.act-time-start').value;
                const timeEnd = block.querySelector('.act-time-end').value;
                
                if (timeStart && timeEnd) {
                    if (timeEnd <= timeStart) {
                        hasTimeError = true;
                    }
                }

                // Собираем отмеченные дни
                const checkedDays = Array.from(block.querySelectorAll('.day-cb:checked')).map(cb => cb.value);
                if (checkedDays.length === 0) {
                    hasDayError = true;
                }

                activities.push({
                    name: block.querySelector('.act-name').value,
                    day: checkedDays.join(', '),
                    time: `${timeStart} - ${timeEnd}`
                });
            });

            if (hasDayError) {
                alert('Ошибка: Пожалуйста, выберите хотя бы один день недели для каждого кружка (нажмите на кнопку дня).');
                return;
            }

            if (hasTimeError) {
                alert('Ошибка: Время окончания кружка должно быть позже времени начала. Пожалуйста, проверьте время.');
                return; 
            }

            const btn = e.target.querySelector('.submit-btn');
            btn.innerText = 'Пожалуйста, подождите, ваш ответ сохраняется...';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            const childName = document.getElementById('childName').value;
            const data = { childName: childName, activities: activities };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if(result.result === 'success') {
                    alert('Данные успешно отправлены! Спасибо.');
                    document.getElementById('surveyForm').reset();
                    // Сбрасываем визуальное выделение дней
                    document.getElementById('activitiesContainer').innerHTML = `
                        <div class="activity-block clearfix">
                            ${getActivityHTML(true)}
                        </div>
                    `;
                } else {
                    alert('Произошла ошибка при отправке.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Произошла ошибка.');
            })
            .finally(() => {
                btn.innerText = 'Отправить данные';
                btn.disabled = false;
                btn.style.opacity = '1';
            });
        });
    </script>
</body>
</html>
